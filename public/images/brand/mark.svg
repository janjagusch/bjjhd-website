<svg xmlns="http://www.w3.org/2000/svg" viewBox="-266.98 -168.74 533.95 337.49">
<defs>
    <clipPath id="clip-a"><path d="M -260 35 A 200 200 0 0 1 140 35 Z"/></clipPath>
    <!-- cut line + centre dot become real holes -->
    <mask id="cuts" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800">
      <rect x="-400" y="-400" width="800" height="800" fill="#fff"/>
      <line x1="140" y1="35" x2="-140" y2="-35" stroke="#000" stroke-width="2"/>
      <circle cx="0" cy="0" r="5" fill="#000"/>
    </mask>
  </defs>
<g id="mark" transform="rotate(-15)">
    <g id="halves" mask="url(#cuts)">
      <path id="half-a" d="M -260 35 A 200 200 0 0 1 140 35 Z" fill="#C76C54"/>
      <path id="half-b" d="M 260 -35 A 200 200 0 0 1 -140 -35 Z" fill="#8CB9A4"/>
      <!-- overlap tone, formerly produced by 80% opacity -->
      <path id="overlap" d="M 260 -35 A 200 200 0 0 1 -140 -35 Z" fill="#AEC2AA" clip-path="url(#clip-a)"/>
    </g>
    <circle id="partner-a" cx="140" cy="35" r="40" fill="#F6B42C"/>
    <circle id="partner-b" cx="-140" cy="-35" r="40" fill="#F6F1E7"/>
  </g>
</svg>
